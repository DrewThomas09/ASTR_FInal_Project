name: Audit 2025-vs-2026 Original NASA TESS TCE Identity, Period Aliases and Duration Units
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exominer-cross-version-ephemeris-identity.yml'
      - 'tess_exominer_cross_version_ephemeris_audit.py'
      - 'tests/test_tess_exominer_cross_version_ephemeris_audit.py'
permissions:
  contents: read
  actions: read
jobs:
  exact-source-cross-version-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original research data analysis requirements
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'pytest>=8,<10' 'scipy>=1.11,<2' 'astropy>=6,<9' 'requests>=2.31,<3'
      - name: Verify all current scientific regressions and original alias/unit tests
        run: python -m pytest -q tests
      - name: Acquire original official NASA 2025 catalog and independently archived unchanged original 2026 NASA model scores
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/2025 data/2026 results/cross_version_ephemeris_identity
          gh run download 42516458999 --repo "${{ github.repository }}" -n official-exominer-2025-tess-labeled-unlabeled-catalogs-verified --dir data/2025
          gh run download 42523749559 --repo "${{ github.repository }}" -n official-NASA-2026-model-on-16-frozen-2025-error-cases-not-independent-validation --dir data/2026
          test -s data/2025/exominerplusplus_catalog_labeled_tces_s1-s67_tess-spoc-2min_complete_1-14-2025_1039.csv
          test -s data/2026/predictions_spoc-tces_set.csv
      - name: Original source-verified 16-TCE cross-version period/event-number/duration-unit audit
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          python -u tess_exominer_cross_version_ephemeris_audit.py \
            --original-2025-catalog data/2025/exominerplusplus_catalog_labeled_tces_s1-s67_tess-spoc-2min_complete_1-14-2025_1039.csv \
            --original-2026-model-results data/2026/predictions_spoc-tces_set.csv \
            --frozen-cohort TESS_16STAR_2025_ERRORS_VS_2026_FROZEN_2026_11_08.json \
            --out results/cross_version_ephemeris_identity 2>&1 | tee results/cross_version_ephemeris_identity/audit.log
      - name: Preserve all sixteen original IDs plus alternate event number matches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verified-2025-v2026-TESS-period-alias-TCE-UID-identity-and-duration-units
          retention-days: 90
          if-no-files-found: warn
          path: results/cross_version_ephemeris_identity/
