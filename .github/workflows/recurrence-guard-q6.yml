name: Frozen Q6 Periodic Eclipse Preservation Guard
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recurrence-guard-q6.yml'
      - 'recurrence_guard_q6.py'
      - 'tests/test_recurrence_guard_q6.py'
      - 'RECURRENCE_GUARD_Q6_FROZEN_2026_11_08.json'

permissions:
  contents: read

jobs:
  frozen-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install science and regression dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" "astropy>=6,<9" "scipy>=1.11,<2" "requests>=2.31,<3" "scikit-learn>=1.3,<2" "pytest>=8,<10"
      - name: Run all scientific regression tests
        run: python -m pytest -q tests
      - name: Execute frozen physical recurrence guard on thirteen independent real Kepler Q6 hosts
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p results/recurrence_guard_q6
          timeout -k 10s 1600s python -u recurrence_guard_q6.py --manifest RECURRENCE_GUARD_Q6_FROZEN_2026_11_08.json --out results/recurrence_guard_q6 2>&1 | tee results/recurrence_guard_q6/run.log
      - name: Preserve ALL source failures, frozen design, per-event outputs and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-q6-periodic-guard-frozen-stars
          retention-days: 90
          if-no-files-found: warn
          path: results/recurrence_guard_q6/
