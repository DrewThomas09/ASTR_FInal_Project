name: Full original NASA SPOC multi-sector PRF disagreement on ground-supported eclipses and five planet controls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-original-SPOC-DV-two-ground-NEB-allsector-discordance.yml'
      - 'tess_two_offtarget_NASA_SPOC_DV_PRF_sector_discordance_nov13.py'
      - 'tests/test_tess_two_offtarget_NASA_SPOC_DV_PRF_sector_discordance_nov13.py'
permissions:
  contents: read
  actions: read
jobs:
  no-favorable-sector-source-selection-original-NASA-DV-PRF-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full scientific regression and source graph tools
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'astropy>=6,<9' 'astroquery>=0.4.9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Verify all previous original NASA and planet-centroid scientific integrity tests
        run: python -m pytest -q tests
      - name: Restore original previously ephemeris-matched NASA official SPOC PRF source positions from all seven source-locked host TICs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/mission_DV results/original_NASA_SPOC_allsector_PRF_disagreement
          gh run download 43456121187 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-NASA-SPOC-seven-host-TCE-ephemeris-checked-DV-PRF-firstsector-vs-external-ground-neb-NOT-classification \
            --dir evidence/mission_DV
          test -s evidence/mission_DV/seven_original_SPOC_NASA_DV_TCE_ephemeris_matched_firstsector_PRF_source_sky_comparison.json
      - name: Report every true original PRF sector including first-sector invalid and contradictory source positions, never select favorable sector
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u tess_two_offtarget_NASA_SPOC_DV_PRF_sector_discordance_nov13.py \
            --original-seven-NASA-DV-PRF-results evidence/mission_DV/seven_original_SPOC_NASA_DV_TCE_ephemeris_matched_firstsector_PRF_source_sky_comparison.json \
            --out results/original_NASA_SPOC_allsector_PRF_disagreement \
            2>&1 | tee results/original_NASA_SPOC_allsector_PRF_disagreement/original_all_sector_mission_PRF_source_comparison.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/original_NASA_SPOC_allsector_PRF_disagreement/original_two_ground_NEBS_full_NASA_SPOC_DV_multisector_PRF_source_discordance_and_five_planet_controls.json').read_text())
          assert d['actual_distinct_original_TIC_host_count']==7
          assert {r['TIC_ID'] for r in d['two_original_ground_supported_offtarget_candidate_sources']}=={382437043,264303333}
          assert len(d['five_independent_catalog_confirmed_planet_host_PRF_controls'])==5
          assert d['first_sector_original_target_not_replaced_with_later_sector'] is True
          assert d['can_this_determine_NASA_ExoMiner_accuracy_or_a_new_planet'] is False
          print('NASA PRF ALL SECTOR AUDIT PASS: seven original host units, all per-sector PRF offsets and invalid records preserved without selection')
          PY
      - name: Archive original NASA true per-sector PRF sky offset to independently ground-supported TIC and confirmed planet host plus graphs and full source integrity record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-NASA-SPOC-2-NEB-ALL-DV-SECTORS-PRF-discordance-5-known-planets-source-unit-not-classification
          path: results/original_NASA_SPOC_allsector_PRF_disagreement/
          retention-days: 90
          if-no-files-found: warn
