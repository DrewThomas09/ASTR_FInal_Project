name: Kepler Original-Flux Event Shape and Instrument Recovery Research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kepler-event-morphology-development.yml'
      - 'kepler_event_shape_diagnostics.py'
      - 'tests/test_kepler_event_shape_diagnostics.py'
permissions:
  contents: read
jobs:
  observed-kepler-morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific source and regression dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "matplotlib>=3.7,<4" "scikit-learn>=1.3,<2" "requests>=2.31,<3" "scipy>=1.11,<2" "astropy>=6,<9" "pytest>=8,<10"
      - name: Check every current regression plus new event-recovery controls
        run: python -m pytest -q tests
      - name: Inspect previously known Kepler planet and binary from original NASA flux in Q6 and Q7
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          mkdir -p results/real_kepler_event_shape_diagnostics
          timeout -k 10s 330s python -u kepler_event_shape_diagnostics.py --quarter 6 --out results/real_kepler_event_shape_diagnostics 2>&1 | tee results/real_kepler_event_shape_diagnostics/quarter6_run.log
          timeout -k 10s 330s python -u kepler_event_shape_diagnostics.py --quarter 7 --out results/real_kepler_event_shape_diagnostics 2>&1 | tee results/real_kepler_event_shape_diagnostics/quarter7_run.log
      - name: Archive real MAST source digests and individual observed-event morphology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-kepler-morphology-companion-diagnostic-not-official-exominer
          retention-days: 90
          if-no-files-found: warn
          path: results/real_kepler_event_shape_diagnostics/
