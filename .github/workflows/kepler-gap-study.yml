name: Run current frozen Kepler gap-masking experiment
on:
  push:
    paths:
      - '.github/workflows/kepler-gap-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-required numerical packages
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" "astropy>=6,<9" "scipy>=1.11,<2" "requests>=2.31,<3" pytest
      - name: Verify all offline unit tests
        run: python -m pytest -q tests
      - name: Run frozen real-data calibration and held-out BLS comparison
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p results/preprocessing_ablation
          timeout -k 5s 960s python -u preprocessing_ablation.py --manifest PREPROCESSING_ABLATION_FROZEN.json --out results/preprocessing_ablation 2>&1 | tee results/preprocessing_ablation/run.log
      - name: Save all original outputs including failures and method limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kepler-preprocessing-frozen-study
          if-no-files-found: warn
          retention-days: 30
          path: results/preprocessing_ablation/
