name: Frozen ExoMiner++ TESS Scalar RF Feature Ablation (Star-Grouped)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-scalar-ai-assisted-replication.yml'
      - 'TESS_SCALAR_ABLATION_FROZEN_2026_11_08.json'
      - 'tess_scalar_ai_assisted_replication.py'
      - 'tests/test_tess_scalar_ai_assisted_replication.py'
permissions:
  contents: read
  actions: read
jobs:
  real-nasa-tess-heldout-scalar-model:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real-source training dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'pytest>=8,<10' 'scipy>=1.11,<2' 'astropy>=6,<9' 'requests>=2.31,<3'
      - name: Verify complete project regression tests before fitting
        run: python -m pytest -q tests
      - name: Fetch authentic preverified 2025 NASA published catalog (NOT a trained NASA model)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/exominer_2025
          gh run download 42516458999 --repo "${{ github.repository }}" -n official-exominer-2025-tess-labeled-unlabeled-catalogs-verified --dir data/exominer_2025
      - name: Run BOTH exact frozen 10-star-fold RF models and host-cluster uncertainty
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir -p results/tess_scalar_ablation
          python -u tess_scalar_ai_assisted_replication.py \
            --labeled data/exominer_2025/exominerplusplus_catalog_labeled_tces_s1-s67_tess-spoc-2min_complete_1-14-2025_1039.csv \
            --manifest TESS_SCALAR_ABLATION_FROZEN_2026_11_08.json \
            --out results/tess_scalar_ablation 2>&1 | tee results/tess_scalar_ablation/train_and_10fold_scoring.log
      - name: Save source-linked new model OOF predictions, fixed fold metrics and preregistered comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-real-TESS-RF4-vs-dutyratio-RUWE-ablation-no-official-CNN-inference
          retention-days: 90
          if-no-files-found: warn
          path: results/tess_scalar_ablation/
