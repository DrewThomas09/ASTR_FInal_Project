name: Original NASA SPOC mission Data Validation PRF source-only discovery for two ground NEBs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-two-ground-NEB-original-MAST-SPOC-DV-discovery-nov13.yml'
      - 'tess_two_ground_neb_original_MAST_SPOC_DV_product_discovery_nov13.py'
      - 'tests/test_tess_two_ground_neb_original_MAST_SPOC_DV_product_discovery_nov13.py'
permissions:
  contents: read
  actions: read
jobs:
  authentic-NASA-SPOC-DV-PRF-xml-product-source-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original MAST source matching and all regression dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'astropy>=6,<9' 'astroquery>=0.4.9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Run full repository science integrity suite including original NASA DV source checks
        run: python -m pytest -q tests
      - name: Restore immutable first-sector original SPOC source manifest from earlier centroid-blind original ground candidate freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/frozen results/original_SPOC_two_NEBS_official_DV_source_availability
          gh run download 43319246311 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-five-new-TESS-SPOC-source-FROZEN-before-any-centroids \
            --dir evidence/frozen
          test -s evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json
      - name: Discover genuine original MAST TESS SPOC DV XML PDF and DVT source products for exact two frozen TCE host TICs; no centroid values read
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u tess_two_ground_neb_original_MAST_SPOC_DV_product_discovery_nov13.py \
            --original-frozen-source evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json \
            --out results/original_SPOC_two_NEBS_official_DV_source_availability \
            2>&1 | tee results/original_SPOC_two_NEBS_official_DV_source_availability/original_MAST_DV_product_discovery_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/original_SPOC_two_NEBS_official_DV_source_availability/original_two_ground_NEBS_MAST_SPOC_DV_product_availability_SOURCE_ONLY.json').read_text())
          assert d['exact_previously_ground_corroborrated_host_TICs_attempted']==2
          assert {r['TIC_ID'] for r in d['source_results_all_no_selection_on_centroid_outcomes']}=={382437043,264303333}
          assert d['original_source_DISCOVERY_only_no_DV_files_downloaded']
          print('ORIGINAL DV SOURCE SCREEN COMPLETE: both actual host TICs, no downloaded DV file or centroid outcome substitution')
          PY
      - name: Archive official NASA DV source availability and missingness, original exact file IDs and catalogue provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-NASA-SPOC-two-ground-NEB-DV-PRF-source-only-inventory-NOT-matched-TCE-or-truth
          path: results/original_SPOC_two_NEBS_official_DV_source_availability/
          retention-days: 90
          if-no-files-found: warn
