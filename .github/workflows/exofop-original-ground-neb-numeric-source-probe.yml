name: Original ExoFOP T6 T11 ground full AstroImageJ numerical source validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exofop-original-ground-neb-numeric-source-probe.yml'
      - 'exofop_two_NEB_original_ground_AIJ_numeric_sources.py'
      - 'tests/test_exofop_two_NEB_original_ground_AIJ_numeric_sources.py'
permissions:
  contents: read
  actions: read
jobs:
  independently-read-original-ground-photometry-source-before-depth-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original ground photometry source parsing dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Verify original AIJ BJD T6 T11 aperture data and source identity guards
        run: python -m pytest -q tests/test_exofop_two_NEB_original_ground_AIJ_numeric_sources.py
      - name: Restore immutable original ExoFOP uploaded filelist rather than selecting on numerical flux outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/inventory results/original_ground_T6_T11_full_AIJ_numeric
          gh run download 43330747316 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-five-SPOC-NEB-ground-photometry-file-and-observation-inventory-NOT-truth \
            --dir evidence/inventory
          test -s evidence/inventory/five_new_original_ExoFOP_ground_photometry_FILELIST_AND_TSERIES_inventory.json
      - name: Fetch exact original reported-neighbor ground lightcurve T6 and T11 full tabular measurements before using any flux
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -u exofop_two_NEB_original_ground_AIJ_numeric_sources.py \
            --original-inventory evidence/inventory/five_new_original_ExoFOP_ground_photometry_FILELIST_AND_TSERIES_inventory.json \
            --out results/original_ground_T6_T11_full_AIJ_numeric \
            2>&1 | tee results/original_ground_T6_T11_full_AIJ_numeric/original_ground_numeric_source_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/original_ground_T6_T11_full_AIJ_numeric/two_ground_reported_NEB_numeric_AIJ_tseries_original_source_profile.json').read_text())
          assert len(d['original_two_uploaded_aperture_source_records'])==2
          assert d['physical_onsky_eclipsing_neighbor_confirmed_by_independent_flux_reanalysis'] is False
          print('SOURCE CHECK: actual ground lightcurve flux source archived if public, no automatic neighbor eclipse assignment')
          PY
      - name: Archive exact real original ground AIJ files, source SHA and timestamps, with errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ExoFOP-T6-T11-neighbor-AstroImageJ-ground-lightcurve-data-before-independent-depth-test
          path: results/original_ground_T6_T11_full_AIJ_numeric/
          retention-days: 90
          if-no-files-found: warn
