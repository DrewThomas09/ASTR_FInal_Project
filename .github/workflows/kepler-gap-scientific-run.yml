name: Real Kepler preprocessing experiment — verified runner
on:
  push:
    paths:
      - '.github/workflows/kepler-gap-scientific-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install all package dependencies for the repo test suite
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" "astropy>=6,<9" "scipy>=1.11,<2" "requests>=2.31,<3" "scikit-learn>=1.3,<2" "pytest>=8,<10"
      - name: Verify regression tests
        run: python -m pytest -q tests
      - name: Compute real Kepler matched-proxy comparison
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p results/preprocessing_ablation
          timeout -k 5s 960s python -u preprocessing_ablation.py --manifest PREPROCESSING_ABLATION_FROZEN.json --out results/preprocessing_ablation 2>&1 | tee results/preprocessing_ablation/run.log
      - name: Preserve full outputs, thresholds and any failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kepler-preprocessing-independent-test
          retention-days: 30
          if-no-files-found: warn
          path: results/preprocessing_ablation/
