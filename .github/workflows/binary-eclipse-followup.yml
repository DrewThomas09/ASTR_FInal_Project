name: Binary-like eclipse follow-up
on:
  push:
    paths:
      - '.github/workflows/binary-eclipse-followup.yml'
      - 'eclipse_vetting_followup.py'
      - 'binary_eclipse_diagnostics.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" "astropy>=6,<9"
      - name: Run independent synthetic holdout
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          mkdir -p results/binary_eclipse_followup
          timeout -k 5s 360s python -u eclipse_vetting_followup.py --out results/binary_eclipse_followup --per-condition 8 2>&1 | tee results/binary_eclipse_followup/run.log
      - name: Save independent experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-eclipse-followup
          retention-days: 30
          if-no-files-found: warn
          path: results/binary_eclipse_followup/
