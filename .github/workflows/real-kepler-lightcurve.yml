name: Real Kepler Light Curve Validation

on:
  push:
    paths:
      - '.github/workflows/real-kepler-lightcurve.yml'
      - 'real_kepler_lightcurve.py'
      - 'blind_transit_benchmark.py'
      - 'transit_consistency.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-kepler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public astronomy and plotting libraries
        run: |
          python -m pip install "astropy>=6,<9" "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" scipy requests pytest
      - name: Search Kepler public archive and run independent tests
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          mkdir -p results/real_kepler
          # A hard 180-second cap avoids indefinite remote-search stalls.
          # Bash pipefail ensures timeout/failure cannot be hidden by tee.
          timeout -k 5s 180s python -u real_kepler_lightcurve.py --out results/real_kepler --trials 3 2>&1 | tee results/real_kepler/run.log
          echo 'Public Kepler FITS experiment completed.'
      - name: Publish figures and experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-kepler-astronomy-validation
          if-no-files-found: warn
          retention-days: 30
          path: results/real_kepler/
