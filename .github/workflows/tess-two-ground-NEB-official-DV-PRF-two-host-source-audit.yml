name: NASA official DV repeated-PRF source-level experiment for the same two original ground eclipses
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-two-ground-NEB-official-DV-PRF-two-host-source-audit.yml'
      - 'tess_two_ground_neb_official_NASA_DV_PRF_whole_host_audit_nov13.py'
      - 'tests/test_tess_two_ground_neb_official_NASA_DV_PRF_whole_host_audit_nov13.py'
permissions:
  contents: read
  actions: read
jobs:
  preserve-primary-earliest-NASA-DV-and-all-12-repeated-processing-quality-PRF-first-sector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full ASTR project scientific tests and reproducible report dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'astropy>=6,<9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Run full scientific test suite and protect earliest NASA original DV search as fixed primary
        run: python -m pytest -q tests
      - name: Restore exact 12 NASA original SPOC DVR XML source SHA / TCE period phase / PRF fit results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/official results/original_SPOC_DV_PRF_whole_host_conclusions
          gh run download 43435616828 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-NASA-SPOC-two-ground-NEB-DVR-XML-TCE-phase-matched-official-PRF-centroid-NOT-false-positive-accuracy \
            --dir evidence/official
          test -s evidence/official/two_ground_NEBS_official_NASA_DV_XML_original_PRF_centroid_source_comparison.json
      - name: Original NASA mission PRF fits, all official invalids, source-level 2 unique hosts, earliest original run still primary
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u tess_two_ground_neb_official_NASA_DV_PRF_whole_host_audit_nov13.py \
            --original-DV-12-XML-results evidence/official/two_ground_NEBS_official_NASA_DV_XML_original_PRF_centroid_source_comparison.json \
            --out results/original_SPOC_DV_PRF_whole_host_conclusions \
            2>&1 | tee results/original_SPOC_DV_PRF_whole_host_conclusions/original_NASA_official_host_source_PRF_reduction.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/original_SPOC_DV_PRF_whole_host_conclusions/two_ground_NEBS_official_NASA_DV_12_source_runs_whole_host_quality_and_PRF_audit.json')
          d=json.loads(p.read_text())
          assert d['n_astrophysical_independent_original_TIC_host_units']==2
          assert d['n_repeated_original_NASA_DV_XML_mission_processing_runs']==12
          assert d['n_ephemeris_concordant_original_NASA_DV_run_TCEs']==12
          assert d['n_official_valid_first_sector_PRF_centroids_across_REPEATED_runs']+d['n_official_invalid_first_sector_PRF_centroids_across_REPEATED_runs']==12
          assert {x['TIC_ID'] for x in d['all_original_official_host_and_run_source_summary']}=={382437043,264303333}
          print('PASS ORIGINAL NASA: 12 repeated reductions = 2 independent stars, preserve earliest even if invalid')
          PY
      - name: Archive original NASA first-sector PRF vs physically ground-observed nearby source comparison per run and repeated-run sensitivity figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-NASA-SPOC-two-ground-NEB-12-DV-runs-two-INDEPENDENT-hosts-PRF-validity-and-source-geometry
          path: results/original_SPOC_DV_PRF_whole_host_conclusions/
          retention-days: 90
          if-no-files-found: warn
