name: Posthoc Published Binary Eclipse Verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recurrence-guard-ephemeris.yml'
      - 'recurrence_guard_external_ephemeris_audit.py'
      - 'tests/test_recurrence_guard_ephemeris_audit.py'

permissions:
  contents: read
  actions: read

jobs:
  original-source-ephemeris:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install science and regression dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" "astropy>=6,<9" "scipy>=1.11,<2" "requests>=2.31,<3" "scikit-learn>=1.3,<2" "pytest>=8,<10"
      - name: Run complete scientific test suite
        run: python -m pytest -q tests
      - name: Retrieve original untouched 13-star output artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p original
          gh run download 42512273665 --repo "${{ github.repository }}" -n new-q6-periodic-guard-frozen-stars --dir original
      - name: Verify original frozen warnings SHA-256
        run: echo '85a6000382a2911a072d637611e9eb85c38be5a56c5b3f423b94151c3e9d532f  original/all_warnings_periodicity_decisions.csv' | sha256sum -c -
      - name: Plot unchanged official Kepler observations against published stellar eclipse centers
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p results/recurrence_ephemeris_check
          timeout -k 10s 600s python -u recurrence_guard_external_ephemeris_audit.py --warnings original/all_warnings_periodicity_decisions.csv --out results/recurrence_ephemeris_check 2>&1 | tee results/recurrence_ephemeris_check/run.log
      - name: Preserve original source hashes and real observed eclipse figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-real-binary-warnings-published-ephemerides
          retention-days: 90
          if-no-files-found: warn
          path: results/recurrence_ephemeris_check/
