name: Kepler Blind Q6-to-Q7 Physical Transit Prediction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kepler-q6-to-q7-blind-prediction.yml'
      - 'q6_to_q7_blind_ephemeris_validation.py'
      - 'tests/test_q6_to_q7_blind_ephemeris_validation.py'
      - 'Q6_TO_Q7_BLIND_PREDICTIVE_VALIDATION_FROZEN_2026_11_08.json'
permissions:
  contents: read
jobs:
  genuine-quarter-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Astropy Kepler scientific toolkit and tests
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "matplotlib>=3.7,<4" "scikit-learn>=1.3,<2" "requests>=2.31,<3" "scipy>=1.11,<2" "astropy>=6,<9" "pytest>=8,<10"
      - name: Verify all software regression tests including strict temporal barrier
        run: python -m pytest -q tests
      - name: Run fixed Q6-fitted BLS model on independent NASA Q7, all planned sources
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p results/out_of_quarter_validation
          timeout -k 10s 1900s python -u q6_to_q7_blind_ephemeris_validation.py --manifest Q6_TO_Q7_BLIND_PREDICTIVE_VALIDATION_FROZEN_2026_11_08.json --out results/out_of_quarter_validation 2>&1 | tee results/out_of_quarter_validation/full_run.log
      - name: Archive all available NASA original source hashes, unchanged predictions and error records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kepler-genuine-blind-quarter-seven-forecast
          retention-days: 90
          if-no-files-found: warn
          path: results/out_of_quarter_validation/
