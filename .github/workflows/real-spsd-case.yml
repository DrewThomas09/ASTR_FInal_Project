name: Documented Real Kepler SPSD Case Study
on:
  push:
    paths:
      - '.github/workflows/real-spsd-case.yml'
      - 'real_spsd_case_study.py'
      - 'tests/test_real_spsd_case_study.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public FITS and statistical dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" "astropy>=6,<9" "scipy>=1.11,<2" "requests>=2.31,<3" "scikit-learn>=1.3,<2" "pytest>=8,<10"
      - name: Test quality-bit logic and real example source handling
        run: python -m pytest -q tests/test_real_spsd_case_study.py tests/test_localized_discontinuity.py
      - name: Retrieve published quality-flagged Kepler star and compare SAP vs PDC
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p results/real_spsd_case
          timeout -k 5s 360s python -u real_spsd_case_study.py --out results/real_spsd_case 2>&1 | tee results/real_spsd_case/run.log
      - name: Retain natural-source plot and experimental caveats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-kepler-spsd-illustration
          retention-days: 90
          if-no-files-found: warn
          path: results/real_spsd_case/
