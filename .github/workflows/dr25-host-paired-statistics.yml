name: NASA DR25 Host-Paired Statistical Accuracy Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dr25-host-paired-statistics.yml'
      - 'DR25_STATISTICAL_VALIDATION_FROZEN_2026_11_08.json'
      - 'dr25_paired_statistical_validation.py'
      - 'tests/test_dr25_paired_statistical_validation.py'

permissions:
  contents: read

jobs:
  original-kepler-dr25-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full reproducible scientific environment
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "matplotlib>=3.7,<4" "scikit-learn>=1.3,<2" "requests>=2.31,<3" "scipy>=1.11,<2" "astropy>=6,<9" "pytest>=8,<10"
      - name: Run every offline regression test
        run: python -m pytest -q tests
      - name: Fetch official DR25 KOI source using the unchanged NASA TAP query
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data results/dr25_inference
          timeout -k 10s 200s python -c 'from ml_screening import load_data; x=load_data("data/kepler_dr25.csv", download=True); print("Retained NASA historical-labeled KOIs",len(x))'
          sha256sum data/kepler_dr25.csv | tee results/dr25_inference/input_file_hash.txt
      - name: Verify pinned catalog SHA and perform original-star paired inference
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          timeout -k 10s 1200s python -u dr25_paired_statistical_validation.py --csv data/kepler_dr25.csv --out results/dr25_inference --protocol DR25_STATISTICAL_VALIDATION_FROZEN_2026_11_08.json 2>&1 | tee results/dr25_inference/full_study_log.txt
      - name: Preserve original source proof, all split predictions, tests and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr25-paired-host-statistical-accuracy-inference
          retention-days: 90
          if-no-files-found: warn
          path: results/dr25_inference/
