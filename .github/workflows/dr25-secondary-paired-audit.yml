name: DR25 Readonly Paired Operating Tradeoff Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dr25-secondary-paired-audit.yml'
      - 'dr25_secondary_paired_tradeoff.py'
      - 'tests/test_dr25_secondary_paired_tradeoff.py'

permissions:
  contents: read
  actions: read

jobs:
  archived-star-clustered-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install science and tests
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "matplotlib>=3.7,<4" "scikit-learn>=1.3,<2" "requests>=2.31,<3" "scipy>=1.11,<2" "astropy>=6,<9" "pytest>=8,<10"
      - name: Run all scientific regression tests
        run: python -m pytest -q tests
      - name: Retrieve exactly original KOI heldout predictions from pinned statistical study
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p original
          gh run download 42513638366 --repo "${{ github.repository }}" -n dr25-paired-host-statistical-accuracy-inference --dir original
      - name: Verify pinned original heldout scores and predictions SHA256
        run: echo '3682e0be30506ddcfe4bbb0c683ed6884454c5e5fbf8d946922fb48248712663  original/primary_heldout_paired_predictions.csv' | sha256sum -c -
      - name: Explore host-paired logistic comparison and class-specific accuracy tradeoff without retraining
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p results/dr25_paired_supplemental
          timeout -k 10s 400s python -u dr25_secondary_paired_tradeoff.py --csv original/primary_heldout_paired_predictions.csv --out results/dr25_paired_supplemental 2>&1 | tee results/dr25_paired_supplemental/run.log
      - name: Archive paired host block inference and all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr25-original-scores-supplemental-recall-fpr-inference
          retention-days: 90
          if-no-files-found: warn
          path: results/dr25_paired_supplemental/
