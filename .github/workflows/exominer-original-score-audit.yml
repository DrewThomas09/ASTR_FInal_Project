name: Audit Original ExoMiner++ Published 2025 TESS Scores
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exominer-original-score-audit.yml'
      - 'exominer_released_score_audit.py'
      - 'tests/test_exominer_released_score_audit.py'
permissions:
  contents: read
  actions: read
jobs:
  published-fold-historical-label-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data science and regression dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'requests>=2.31,<3' 'scipy>=1.11,<2' 'astropy>=6,<9' 'pytest>=8,<10'
      - name: Verify all offline research tests
        run: python -m pytest -q tests
      - name: Fetch exact already independently checksummed NASA 2025 official CSV snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/exominer_2025
          gh run download 42516458999 --repo "${{ github.repository }}" -n official-exominer-2025-tess-labeled-unlabeled-catalogs-verified --dir data/exominer_2025
      - name: Verify source MD5 and run complete published-score scientific audit
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir -p results/exominer_released_score_audit
          python -u exominer_released_score_audit.py \
            --labeled data/exominer_2025/exominerplusplus_catalog_labeled_tces_s1-s67_tess-spoc-2min_complete_1-14-2025_1039.csv \
            --unknown data/exominer_2025/exominerplusplus_catalog_unk_tces_s1-s67_tess-spoc-2min_complete_1-16-2025_1014.csv \
            --manifest EXOMINER_PUBLIC_DATA_MANIFEST_2026_11_08.json \
            --out results/exominer_released_score_audit 2>&1 | tee results/exominer_released_score_audit/full_original_source_audit_log.txt
      - name: Preserve original cross-validated score comparison, individual error IDs and limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-exominer-released-tess-score-audit-no-new-training
          retention-days: 90
          if-no-files-found: warn
          path: results/exominer_released_score_audit/
