name: Real original TESS SPOC target-pixel out-minus-in NEB images and shifted-phase controls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-two-ground-NEB-original-TPF-pixel-difference-images.yml'
      - 'tess_two_ground_neb_original_TPF_pixel_difference_images_nov12.py'
      - 'tests/test_tess_two_ground_neb_original_TPF_pixel_difference_images_nov12.py'
permissions:
  contents: read
  actions: read
jobs:
  compare-original-TESS-pixel-difference-with-ground-NEB-sky-and-quarter-phase-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install complete repository testing and NASA original TPF science dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'astropy>=6,<9' 'astroquery>=0.4.9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Validate all repository original astronomy synthetic and source-integrity tests
        run: python -m pytest -q tests
      - name: Restore exact first-sector original TESS source selection and actual independently source-matched TPF mask geometry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/frozen evidence/mask results/original_TPF_NEBS_ground_source_pixel_differences
          gh run download 43319246311 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-five-new-TESS-SPOC-source-FROZEN-before-any-centroids \
            --dir evidence/frozen
          gh run download 43348300280 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-SPOC-TPF-two-ground-NEB-SAP-vs-MOM-aperture-pixel-source-WCS-geometry-NOT-flux-capture \
            --dir evidence/mask
          test -s evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json
          test -s evidence/mask/original_two_ground_NEBS_SPOC_TPF_SAP_and_moment_centroid_mask_geometry.json
      - name: Re-download SHA-matched original SPOC TPF, compute true actual per-pixel out-minus-in difference vs fixed quarter-period control images
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u tess_two_ground_neb_original_TPF_pixel_difference_images_nov12.py \
            --frozen-five-source-manifest evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json \
            --original-tpf-mask-results evidence/mask/original_two_ground_NEBS_SPOC_TPF_SAP_and_moment_centroid_mask_geometry.json \
            --out results/original_TPF_NEBS_ground_source_pixel_differences \
            --working data/original_MAST_TPF_two_ground_supported_NEBS \
            2>&1 | tee results/original_TPF_NEBS_ground_source_pixel_differences/original_pixel_difference_science_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/original_TPF_NEBS_ground_source_pixel_differences/two_real_ground_sky_NEBS_original_TPF_outminusin_pixel_difference_and_quarter_phase_results.json').read_text())
          assert d['original_two_physical_source_TICs_attempted']==2
          assert {r['original_TESS_host_TIC'] for r in d['original_source_TPF_pixel_difference_results']}=={382437043,264303333}
          assert d['source_TICs_eligible_at_predeclared_event_and_phase_control_rule']<=2
          print('PASS: exact original frozen source and original FITS, no PRF or NASA model claim')
          PY
      - name: Archive original same-event detector pixel difference images, controls, source SHA, actual original physical TIC positions, failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-TESS-SPOC-ground-source-two-NEB-true-vs-quarter-phase-TPF-pixel-difference-images-NOT-official-PRF
          path: results/original_TPF_NEBS_ground_source_pixel_differences/
          retention-days: 90
          if-no-files-found: warn
