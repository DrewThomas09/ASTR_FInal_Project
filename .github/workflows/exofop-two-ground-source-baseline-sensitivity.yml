name: Original ground ExoFOP T6 T11 baseline sensitivity source-SHA reanalysis
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exofop-two-ground-source-baseline-sensitivity.yml'
      - 'exofop_two_original_ground_neb_baseline_robustness.py'
      - 'tests/test_exofop_two_original_ground_neb_baseline_robustness.py'
permissions:
  contents: read
  actions: read
jobs:
  independently-test-original-ground-eclipse-vs-baseline-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original ground source physical and numerical analysis requirements
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'astropy>=6,<9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Run complete repository test suite, including baseline-drift non-eclipse controls
        run: python -m pytest -q tests
      - name: Retrieve actual SHA-verified original observer predicted ground eclipse windows and measured original flux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/first evidence/numeric results/original_ground_NEB_baseline_robustness
          gh run download 43332062967 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n ExoFOP-original-ground-T6-T11-observer-predicted-window-AIJ-photometry-NOT-full-sky-localization \
            --dir evidence/first
          gh run download 43331725492 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-T6-T11-neighbor-AstroImageJ-ground-lightcurve-data-before-independent-depth-test \
            --dir evidence/numeric
          test -s evidence/first/two_ground_NEB_original_AIJ_fixed_reported_ingress_egress_aperture_flux_results.json
          test -s evidence/numeric/two_ground_reported_NEB_numeric_AIJ_tseries_original_source_profile.json
      - name: Reproduce both original ground source measured depths from same file SHA and compare pre/post/trend-only baselines
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u exofop_two_original_ground_neb_baseline_robustness.py \
            --original-ground-output evidence/first/two_ground_NEB_original_AIJ_fixed_reported_ingress_egress_aperture_flux_results.json \
            --original-numeric-AIJ-source evidence/numeric \
            --out results/original_ground_NEB_baseline_robustness \
            2>&1 | tee results/original_ground_NEB_baseline_robustness/source_baseline_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/original_ground_NEB_baseline_robustness/two_original_ground_NEB_T6_T11_source_SHA_fixed_baseline_robustness.json').read_text())
          assert d['n_ground_observer_reported_NEB_cases']==2
          assert {x['TIC_ID'] for x in d['all_original_same_file_same_window_results']}=={382437043,264303333}
          assert all(x['not_independent_sky_plate_solved_source_identity'] for x in d['all_original_same_file_same_window_results'])
          print('PASS: same original ExoFOP ground observation times, source SHA and observer reports, no mission model changes')
          PY
      - name: Archive all original ground-source same-window sensitivity results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ExoFOP-T6-T11-same-source-robust-baseline-sensitivity-NOT-full-neb-truth
          path: results/original_ground_NEB_baseline_robustness/
          retention-days: 90
          if-no-files-found: warn
