name: ExoFOP external NEB evidence candidate screening - no centroid inference
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exofop-neb-external-screen.yml'
      - 'exofop_neb_candidate_screen.py'
      - 'tests/test_exofop_neb_candidate_screen.py'
      - 'exofop_fp_observing_note_triage.py'
      - 'tests/test_exofop_fp_observing_note_triage.py'
permissions:
  contents: read
jobs:
  screen-public-exofop-source-evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test and official public-source download dependencies
        run: |
          python -m pip install 'requests>=2.31,<3' 'pytest>=8,<10' 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'matplotlib>=3.7,<4' 'scikit-learn>=1.3,<2' 'astropy>=6,<9'
      - name: Validate public catalog parsing and never-fabricated source-truth semantics
        run: python -m pytest -q tests/test_exofop_neb_candidate_screen.py tests/test_exofop_fp_observing_note_triage.py
      - name: Download current official public ExoFOP TOI table and record unaltered catalog SHA256
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p results/exofop_external_candidate_screen
          python -u exofop_neb_candidate_screen.py --repo-root . \
            --out results/exofop_external_candidate_screen \
            2>&1 | tee results/exofop_external_candidate_screen/full_public_source_screen.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("results/exofop_external_candidate_screen")
          j=json.loads((d/"ExoFOP_external_NEBS_and_EBS_screening_summary.json").read_text())
          b=(d/"original_exofop_toi_catalog_snapshot.csv").read_bytes()
          assert j["original_raw_csv_sha256"]==hashlib.sha256(b).hexdigest()
          assert j["exclusion_56_prior_stars_plus_pilot"]==57
          assert j["eligible_catalog_NEBS_new_distinct_TICs"]>=0
          assert j["eligible_catalog_EBS_new_distinct_TICs"]>=0
          assert all(not x["truth_localization_verified"] and
                     not x["moment_centroid_evaluated"]
                     for group in j["preview_first_12_hash_ordered_each_not_selected_or_validated"].values()
                     for x in group)
          print("PASS: original ExoFOP public snapshot and candidate-only screening; no verified source truth yet")
          PY
      - name: Screen original ExoFOP observing notes from broad-FP statuses for human evidence review
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -u exofop_fp_observing_note_triage.py \
            --fp-csv results/exofop_external_candidate_screen/FP_broad_false_positive_category_NEEDS_subtype_evidence.csv \
            --max-sources 30 \
            --out results/exofop_external_candidate_screen \
            2>&1 | tee results/exofop_external_candidate_screen/public_observing_notes_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('results/exofop_external_candidate_screen/first_public_FP_observing_note_triage.json').read_text())
          assert j['number_requested_for_public_note_screen']<=30
          assert all(r['physical_source_truth_verified'] is False and
                     r['NASA_exominer_classification_evaluated'] is False for r in j['source_rows'])
          print('PASS: public observing notes preserved for human review; NO validated off-target positions')
          PY
      - name: Archive public original catalog, strict preliminary candidates and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-original-exofop-candidate-NEB-EB-screen-NOT-ground-truth-or-NASA-accuracy
          path: results/exofop_external_candidate_screen/
          retention-days: 90
          if-no-files-found: warn
