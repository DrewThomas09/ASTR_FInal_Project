name: NASA-ExoMiner-Inspired Kepler Transit Views (Engineering, NOT NASA Inference)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exominer-inspired-view-demo.yml'
      - 'exominer_inspired_kepler_views.py'
      - 'tests/test_exominer_inspired_kepler_views.py'
permissions:
  contents: read

jobs:
  view-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source and regression dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "matplotlib>=3.7,<4" "scikit-learn>=1.3,<2" "requests>=2.31,<3" "scipy>=1.11,<2" "astropy>=6,<9" "pytest>=8,<10"
      - name: Run all current scientific software regression tests
        run: python -m pytest -q tests
      - name: Build physically grounded independent-event views on previously studied Kepler planet and binary
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p results/exominer_inspired_kepler_views
          timeout -k 10s 240s python -u exominer_inspired_kepler_views.py --kic 11804465 --quarter 6 --out results/exominer_inspired_kepler_views 2>&1 | tee results/exominer_inspired_kepler_views/Kepler12_demo.log
          timeout -k 10s 240s python -u exominer_inspired_kepler_views.py --kic 9837578 --quarter 6 --out results/exominer_inspired_kepler_views 2>&1 | tee results/exominer_inspired_kepler_views/Kepler35_demo.log
      - name: Archive original NASA sources and actual input view tensors with masks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kepler-exominer-inspired-flux-views-NOT-exominer-scores
          retention-days: 90
          if-no-files-found: warn
          path: results/exominer_inspired_kepler_views/
