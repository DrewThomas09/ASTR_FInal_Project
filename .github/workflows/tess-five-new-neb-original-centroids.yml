name: Five new frozen authentic TESS SPOC host centroids vs ExoFOP note-named neighbors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-five-new-neb-original-centroids.yml'
      - 'tess_five_new_neb_original_source_centroid_experiment.py'
      - 'tests/test_tess_five_new_neb_original_source_centroid_experiment.py'
permissions:
  contents: read
  actions: read
jobs:
  independent-host-level-paired-source-centroid-direction-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original TESS astrophysical source and regression packages
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'matplotlib>=3.7,<4' 'astropy>=6,<9' 'scikit-learn>=1.3,<2' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Run whole repository scientific test suite
        run: python -m pytest -q tests
      - name: Retrieve unchanged original-source five-new-host manifest frozen PRIOR to any centroids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/frozen results/five_new_NEB_original_SPOC_centroids
          gh run download 43319246311 --repo "${{ github.repository }}" \
            -n original-ExoFOP-five-new-TESS-SPOC-source-FROZEN-before-any-centroids \
            --dir evidence/frozen
          test -s evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json
      - name: Process each of exactly five original SPOC TESS target light curves and target-pixel WCS at fixed sector and external ephemeris
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u tess_five_new_neb_original_source_centroid_experiment.py \
            --frozen-source-manifest evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json \
            --out results/five_new_NEB_original_SPOC_centroids \
            --working data/five_new_hosts_original_2min_SPOC_FITS \
            2>&1 | tee results/five_new_NEB_original_SPOC_centroids/frozen_five_original_science_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/five_new_NEB_original_SPOC_centroids/five_frozen_NEB_new_TESS_SPOC_host_original_WCS_centroid_results.json').read_text())
          assert d['exact_new_host_star_count_attempted']==5
          assert len(d['all_original_source_results'])==5
          assert all(r['external_ground_truth_NEBS_independently_confirmed'] is False
                     for r in d['all_original_source_results'])
          print('PASS: all five prior-frozen hosts retained, no independent ground-truth or NASA accuracy claim')
          PY
      - name: Archive exact five host original source SHA provenance, all failures, physical vectors and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-original-TESS-SPOC-new-hosts-source-blind-centroid-WCS-exploratory-NOT-verified-NEB-truth
          path: results/five_new_NEB_original_SPOC_centroids/
          retention-days: 90
          if-no-files-found: warn
