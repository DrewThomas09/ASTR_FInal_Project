name: DR25 Long Period Candidate Recall Safety Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dr25-period-aware-recall.yml'
      - 'PERIOD_AWARE_DR25_VALIDATION_FROZEN_2026_11_08.json'
      - 'dr25_period_aware_recall_experiment.py'
      - 'tests/test_dr25_period_aware_recall_experiment.py'

permissions:
  contents: read

jobs:
  period-aware-historical-label-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install science and tests
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "matplotlib>=3.7,<4" "scikit-learn>=1.3,<2" "requests>=2.31,<3" "scipy>=1.11,<2" "astropy>=6,<9" "pytest>=8,<10"
      - name: Run all offline scientific regression tests
        run: python -m pytest -q tests
      - name: Download EXACT existing pinned NASA DR25 source
        run: |
          set -euo pipefail
          mkdir -p results/period_aware_dr25
          timeout -k 10s 200s python -c 'from ml_screening import load_data; d=load_data("data/kepler_dr25.csv",download=True); print("Original labeled historical KOIs",len(d))'
          sha256sum data/kepler_dr25.csv | tee results/period_aware_dr25/input_file_hash.txt
          echo 'c907e064c7369d4b073ba422283ddfbbf7499d472ec3cc0787254f3407e5e045  data/kepler_dr25.csv' | sha256sum -c -
      - name: Evaluate predeclared policy on all ten NEW grouped-star splits, including failures
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          timeout -k 10s 1000s python -u dr25_period_aware_recall_experiment.py --csv data/kepler_dr25.csv --out results/period_aware_dr25 2>&1 | tee results/period_aware_dr25/full_study_log.txt
      - name: Preserve source hash, new heldout predictions, raw tradeoff table and all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr25-long-period-validation-only-threshold-comparison
          retention-days: 90
          if-no-files-found: warn
          path: results/period_aware_dr25/
