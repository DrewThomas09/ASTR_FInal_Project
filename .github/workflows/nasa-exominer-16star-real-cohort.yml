name: Frozen 16-TIC Official NASA ExoMiner++ Cohort and Same-SPOC Flux Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nasa-exominer-16star-real-cohort.yml'
      - 'TESS_16STAR_OFFICIAL_EXOMINER_COHORT_FROZEN_2026_11_08.json'
      - 'tess_16star_official_exominer_tics.csv'
      - 'tess_exominer_16star_cohort_audit.py'
      - 'tests/test_tess_exominer_16star_cohort_audit.py'
permissions:
  contents: read
jobs:
  sixteen-real-tess-original-nasa-inferences:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen labels, all 16 source IDs and full software regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'pytest>=8,<10' 'scipy>=1.11,<2' 'astropy>=6,<9' 'requests>=2.31,<3'
          python -m pytest -q tests
          python - <<'PY'
          import json,pandas as pd
          from tess_exominer_16star_cohort_audit import source_manifest
          spec=source_manifest("TESS_16STAR_OFFICIAL_EXOMINER_COHORT_FROZEN_2026_11_08.json")
          source=pd.read_csv("tess_16star_official_exominer_tics.csv",dtype=str)
          expected={(str(x['tic_id']),x['sector_run']) for x in spec['source_records']}
          found={(str(x.tic_id),x.sector_run) for x in source.itertuples(index=False)}
          assert len(source)==len(expected)==16 and found==expected, "Original frozen TIC list differs"
          print("Verified frozen preselected original 16 TIC/sector IDs, 4 each KP/CP/EB/NTP and two per MES stratum")
          PY
      - name: Prepare audit folder and show original target list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/nasa_exominer_16star
          cp tess_16star_official_exominer_tics.csv results/nasa_exominer_16star/tics_writable.csv
          cp TESS_16STAR_OFFICIAL_EXOMINER_COHORT_FROZEN_2026_11_08.json results/nasa_exominer_16star/original_frozen_cohort.json
          cat tess_16star_official_exominer_tics.csv
          df -h .
          free -h
      - name: Pull the SAME immutable official NASA v2.4.0 pretrained container previously verified
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          nasa_image="ghcr.io/nasa/exominer@sha256:1b7ffac9db8afe1787ec9a0464ed8cc16ab91b7a280e6e824c27e3a121b0c6e9"
          docker pull "$nasa_image" 2>&1 | tee results/nasa_exominer_16star/immutable_nasa_image_pull.log
          docker image inspect "$nasa_image" --format '{{json .RepoDigests}}' > results/nasa_exominer_16star/original_nasa_image_digest.json
          docker image inspect "$nasa_image" --format '{{.Id}}' > results/nasa_exominer_16star/original_nasa_image_id.txt
      - name: Real 16-TIC pretrained inference, no local model changes
        timeout-minutes: 29
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          nasa_image="ghcr.io/nasa/exominer@sha256:1b7ffac9db8afe1787ec9a0464ed8cc16ab91b7a280e6e824c27e3a121b0c6e9"
          docker run --rm --shm-size=2g \
            -e OPENBLAS_NUM_THREADS=1 \
            -e OMP_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -e VECLIB_MAXIMUM_THREADS=1 \
            -e NUMEXPR_NUM_THREADS=1 \
            -e TF_NUM_INTRAOP_THREADS=1 \
            -e TF_NUM_INTEROP_THREADS=1 \
            -v "${PWD}/results/nasa_exominer_16star/tics_writable.csv:/tics_tbl.csv" \
            -v "${PWD}/results/nasa_exominer_16star:/outputs" \
            "$nasa_image" \
            --tic_ids_fp=/tics_tbl.csv \
            --output_dir=/outputs \
            --data_collection_mode=2min \
            --num_processes=1 \
            --num_jobs=4 \
            --get_mast_urls_dv_reports=false \
            --stellar_parameters_source=tess-spoc \
            --ruwe_source=unavailable \
            --task=planet-validation \
            --exominer_model=single \
            --max_model_workers=1 2>&1 | tee results/nasa_exominer_16star/nasa_unchanged_model_stdout.log
          if [[ ! -s results/nasa_exominer_16star/predictions_spoc-tces_set.csv ]]; then
            echo "No actual official NASA predictions were returned. Inspect original per-job source failures." >&2
            exit 1
          fi
          head -n 9 results/nasa_exominer_16star/predictions_spoc-tces_set.csv
      - name: Analyze original NASA scores plus matching real SPOC event recovery, retain every missing source
        timeout-minutes: 6
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p results/nasa_exominer_16star/frozen_cohort_audit
          python -u tess_exominer_16star_cohort_audit.py \
            --cohort TESS_16STAR_OFFICIAL_EXOMINER_COHORT_FROZEN_2026_11_08.json \
            --predictions results/nasa_exominer_16star/predictions_spoc-tces_set.csv \
            --nasa-output-root results/nasa_exominer_16star \
            --out results/nasa_exominer_16star/frozen_cohort_audit 2>&1 | tee results/nasa_exominer_16star/frozen_cohort_audit/real_16star_cohort_stdout.log
      - name: Archive immutable NASA scores, all 16 success/failure rows, source-tracking and physical event measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-NASA-exominer-v240-frozen-16star-cohort-not-independent-performance
          retention-days: 90
          if-no-files-found: warn
          path: |
            results/nasa_exominer_16star/original_frozen_cohort.json
            results/nasa_exominer_16star/immutable_nasa_image_pull.log
            results/nasa_exominer_16star/original_nasa_image_digest.json
            results/nasa_exominer_16star/original_nasa_image_id.txt
            results/nasa_exominer_16star/nasa_unchanged_model_stdout.log
            results/nasa_exominer_16star/run_main.log
            results/nasa_exominer_16star/pipeline_run_config.yaml
            results/nasa_exominer_16star/master_tic_tracking_summary.csv
            results/nasa_exominer_16star/master_tce_tracking_summary.csv
            results/nasa_exominer_16star/predictions_spoc-tces_set.csv
            results/nasa_exominer_16star/job_*/run_*.log
            results/nasa_exominer_16star/frozen_cohort_audit/
