name: Frozen 13-star real Kepler external test
on:
  push:
    paths:
      - '.github/workflows/frozen-external-cohort.yml'
      - 'real_external_cohort.py'
      - 'real_external_cohort_frozen.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-kepler-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed astronomy analysis dependencies
        run: python -m pip install "astropy>=6,<9" "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" scipy requests
      - name: Analyze all preselected targets without any threshold tuning
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          mkdir -p results/real_external_cohort
          timeout -k 5s 660s python -u real_external_cohort.py --out results/real_external_cohort 2>&1 | tee results/real_external_cohort/run.log
      - name: Preserve attempted targets, full denominators and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-real-kepler-external-cohort
          if-no-files-found: warn
          retention-days: 30
          path: results/real_external_cohort/
