name: Original ground nearby eclipses predict TESS blended transit depth and physical centroid vector
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-ground-NEB-idealized-original-flux-dilution-and-WCS-centroid.yml'
      - 'tess_two_ground_neb_idealized_blended_flux_and_centroid_physics_nov12.py'
      - 'tests/test_tess_two_ground_neb_idealized_blended_flux_and_centroid_physics_nov12.py'
permissions:
  contents: read
  actions: read
jobs:
  calculate_original-ground-neb-flux-contrast-and-TESS-crowded-aperture-physics-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source and all science test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'astropy>=6,<9' 'astroquery>=0.4.9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Run complete original astronomy scientific regression suite and synthetic two-body blended source math tests
        run: python -m pytest -q tests
      - name: Restore seven immutable authentic original NASA TESS, original ground WCS and ground lightcurve, source note, independent Tmag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/tess evidence/groundflux evidence/groundsky evidence/notes evidence/neighbors evidence/catalog evidence/phase evidence/robustness results/physical_ground_NEBS_to_TESS_dilution
          gh run download 43319506539 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n five-original-TESS-SPOC-new-hosts-source-blind-centroid-WCS-exploratory-NOT-verified-NEB-truth \
            --dir evidence/tess
          gh run download 43332062967 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n ExoFOP-original-ground-T6-T11-observer-predicted-window-AIJ-photometry-NOT-full-sky-localization \
            --dir evidence/groundflux
          gh run download 43333211789 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-two-NEB-ground-AIJ-T6-T11-plate-solved-WCS-sky-TIC-identity \
            --dir evidence/groundsky
          gh run download 43331123345 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-23-ground-NEBcheck-and-photometry-uploads-NOT-proof-of-eclipse \
            --dir evidence/notes
          gh run download 43318756858 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-ten-new-SPOC-NEB-named-neighbors-NOT-verified-physical-labels \
            --dir evidence/neighbors
          gh run download 43302487226 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n public-original-exofop-candidate-NEB-EB-screen-NOT-ground-truth-or-NASA-accuracy \
            --dir evidence/catalog
          gh run download 43347269538 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n two-original-ground-verified-NEB-TESS-signed-away-true-vs-quarter-phase-controls-NOT-classifier-accuracy \
            --dir evidence/phase
          gh run download 43332466646 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-T6-T11-same-source-robust-baseline-sensitivity-NOT-full-neb-truth \
            --dir evidence/robustness
          test -s evidence/tess/five_frozen_NEB_new_TESS_SPOC_host_original_WCS_centroid_results.json
          test -s evidence/groundflux/two_ground_NEB_original_AIJ_fixed_reported_ingress_egress_aperture_flux_results.json
          test -s evidence/groundsky/two_ground_NEBS_actual_AIJ_aperture_WCS_to_external_TIC_sky_identity.json
          test -s evidence/notes/23_frozen_original_ExoFOP_ground_uploads_NEBcheck_and_photometry_text_audit.json
          test -s evidence/neighbors/original_ExoFOP_TIC_382437043_nearby_astrometry.csv
          test -s evidence/neighbors/original_ExoFOP_TIC_264303333_nearby_astrometry.csv
          test -s evidence/catalog/original_exofop_toi_catalog_snapshot.csv
          test -s evidence/phase/two_ground_sky_corroborrated_neb_original_TESS_phase_specific_signed_away_projected_vectors.json
          test -s evidence/robustness/two_original_ground_NEB_T6_T11_source_SHA_fixed_baseline_robustness.json
      - name: Compare original ground eclipse source flux, original independent Tmag, true original TESS observed PDCSAP depth and original TPF sky centroid under exact two-star full-inclusion physics
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u tess_two_ground_neb_idealized_blended_flux_and_centroid_physics_nov12.py \
            --original-five-TESS evidence/tess/five_frozen_NEB_new_TESS_SPOC_host_original_WCS_centroid_results.json \
            --original-ground-flux evidence/groundflux/two_ground_NEB_original_AIJ_fixed_reported_ingress_egress_aperture_flux_results.json \
            --original-ground-sky evidence/groundsky/two_ground_NEBS_actual_AIJ_aperture_WCS_to_external_TIC_sky_identity.json \
            --original-note-audit evidence/notes/23_frozen_original_ExoFOP_ground_uploads_NEBcheck_and_photometry_text_audit.json \
            --original-neighbor-catalogs evidence/neighbors \
            --original-exofop-catalog evidence/catalog/original_exofop_toi_catalog_snapshot.csv \
            --original-quarter-phase-results evidence/phase/two_ground_sky_corroborrated_neb_original_TESS_phase_specific_signed_away_projected_vectors.json \
            --original-ground-robustness evidence/robustness/two_original_ground_NEB_T6_T11_source_SHA_fixed_baseline_robustness.json \
            --out results/physical_ground_NEBS_to_TESS_dilution \
            2>&1 | tee results/physical_ground_NEBS_to_TESS_dilution/original_TESS_vs_ground_flux_conservation_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/physical_ground_NEBS_to_TESS_dilution/original_two_ground_supported_NEBS_TESS_flux_dilution_and_centroid_physics_POSTHOC.json').read_text())
          assert d['n_previously_ground_sky_supported_NEBS']==2
          assert {r['TIC_ID'] for r in d['all_posthoc_two_source_physical_predictions']}=={382437043,264303333}
          assert d['status_of_validated_NASA_ExoMiner_planet_classification_gain']=='NOT TESTED'
          print('PHYSICAL SOURCE CHECK: two unchanged authentic NEB TICs, all original TESS/ground results, no NASA classifier accuracy claims')
          PY
      - name: Archive two-body predicted ground-to-TESS depth, CCD geometric magnitude, source SHAs, and all incompatibilities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ground-NEB-TESS-idealized-two-star-blend-depth-and-signed-CCD-physics-POSTHOC-not-model-accuracy
          path: results/physical_ground_NEBS_to_TESS_dilution/
          retention-days: 90
          if-no-files-found: warn
