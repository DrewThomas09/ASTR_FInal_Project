name: Original ExoFOP two reported NEB neighbor astrometry crosschecks
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exofop-two-posthoc-neb-astrometry.yml'
      - 'exofop_two_reported_neb_astrometry_crosscheck.py'
      - 'tests/test_exofop_two_reported_neb_astrometry_crosscheck.py'
permissions:
  contents: read
  actions: read
jobs:
  verify-public-neighbors-not-model-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original public-source acquisition and parsing test dependencies
        run: python -m pip install 'pytest>=8,<10' 'requests>=2.31,<3'
      - name: Validate TIC and separation source checks with synthetic test fixture
        run: python -m pytest -q tests/test_exofop_two_reported_neb_astrometry_crosscheck.py
      - name: Load archived original ExoFOP ground observations and prevent reselected notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence results/independent_nearby_astrometry
          gh run download 43302814103 --repo "${{ github.repository }}" \
            -n public-original-exofop-candidate-NEB-EB-screen-NOT-ground-truth-or-NASA-accuracy \
            --dir evidence
          test -s evidence/first_public_FP_observing_note_triage.json
      - name: Check genuine ExoFOP neighboring TIC angular positions for two post-hoc case studies
        run: |
          set -euo pipefail
          python -u exofop_two_reported_neb_astrometry_crosscheck.py \
            --original-notes evidence/first_public_FP_observing_note_triage.json \
            --out results/independent_nearby_astrometry \
            2>&1 | tee results/independent_nearby_astrometry/source_astrometry_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/independent_nearby_astrometry/Two_Original_ExoFOP_reported_NEB_nearby_source_crosschecks.json').read_text())
          assert len(d['cases'])==2
          assert all(not x['full_independent_physical_source_truth'] for x in d['cases'])
          assert all(not x['same_event_TESS_2min_FITS_verified'] for x in d['cases'])
          print('PASS: external neighbors traceable; original TESS centroid experiment still requires new sample and ephemeris checks')
          PY
      - name: Archive original ExoFOP nearby-source evidence and zero overclaim caveats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ExoFOP-two-reported-NEB-neighbor-astrometry-posthoc-NOT-blind
          path: results/independent_nearby_astrometry/
          retention-days: 90
          if-no-files-found: warn
