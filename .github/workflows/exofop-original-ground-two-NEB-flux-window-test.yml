name: Reanalyze original ground T6 and T11 NEB eclipse numerical flux in fixed observer predicted windows
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exofop-original-ground-two-NEB-flux-window-test.yml'
      - 'exofop_two_ground_NEBS_original_AIJ_fixed_window_depth.py'
      - 'tests/test_exofop_two_ground_NEBS_original_AIJ_fixed_window_depth.py'
permissions:
  contents: read
  actions: read
jobs:
  test-original-ground-aperture-eclipses-without-refitting-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original ground photometry and full project tests
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'astropy>=6,<9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Run complete repository scientific regression suite before original ground flux measurements
        run: python -m pytest -q tests
      - name: Restore previously fixed original uploaded AIJ time-series and NEBcheck report files with original SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/numeric evidence/nebc results/ground_T6_T11_actual_observer_fixed_eclipse
          gh run download 43331725492 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-T6-T11-neighbor-AstroImageJ-ground-lightcurve-data-before-independent-depth-test \
            --dir evidence/numeric
          gh run download 43331123345 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-23-ground-NEBcheck-and-photometry-uploads-NOT-proof-of-eclipse \
            --dir evidence/nebc
          test -s evidence/numeric/two_ground_reported_NEB_numeric_AIJ_tseries_original_source_profile.json
          test -s evidence/nebc/23_frozen_original_ExoFOP_ground_uploads_NEBcheck_and_photometry_text_audit.json
      - name: Quantify actual original ground BJD_TDB target and neighbor flux without optimizing original reported timing
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u exofop_two_ground_NEBS_original_AIJ_fixed_window_depth.py \
            --original-AIJ-files evidence/numeric \
            --original-neb-files evidence/nebc \
            --prior-source-audit evidence/nebc/23_frozen_original_ExoFOP_ground_uploads_NEBcheck_and_photometry_text_audit.json \
            --out results/ground_T6_T11_actual_observer_fixed_eclipse \
            2>&1 | tee results/ground_T6_T11_actual_observer_fixed_eclipse/original_ground_BJD_source_science_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/ground_T6_T11_actual_observer_fixed_eclipse/two_ground_NEB_original_AIJ_fixed_reported_ingress_egress_aperture_flux_results.json').read_text())
          assert d['two_distinct_host_stars_attempted']==2
          assert not d['formal_physical_source_truth_confirmed']
          assert all(x['TIC_ID'] in (382437043,264303333) for x in d['original_reported_cases'])
          print('PASS: original two ground source identities and observer-predicted ingress windows preserved; not model accuracy')
          PY
      - name: Archive actual ground neighbor flux, fixed other-aperture controls, observations, uncertainty and source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExoFOP-original-ground-T6-T11-observer-predicted-window-AIJ-photometry-NOT-full-sky-localization
          path: results/ground_T6_T11_actual_observer_fixed_eclipse/
          retention-days: 90
          if-no-files-found: warn
