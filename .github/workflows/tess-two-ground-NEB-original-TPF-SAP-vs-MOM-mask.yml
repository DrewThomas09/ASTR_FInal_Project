name: Original TESS TPF SAP vs moment centroid masks for two ground-sky verified NEB neighbors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-two-ground-NEB-original-TPF-SAP-vs-MOM-mask.yml'
      - 'tess_two_ground_neb_original_TPF_aperture_mask_check_nov12.py'
      - 'tests/test_tess_two_ground_neb_original_TPF_aperture_mask_check_nov12.py'
permissions:
  contents: read
  actions: read
jobs:
  analyze-original-source-frozen-target-pixel-photometry-vs-centroid-mask-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install all original science, WCS and repository-test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'astropy>=6,<9' 'astroquery>=0.4.9' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Test full scientific repo including original TESS pixel mask bitwise and source geometry guards
        run: python -m pytest -q tests
      - name: Restore unchanged five-star pre-centroid source manifest and verified independent ground-image sky mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/frozen evidence/ground results/original_TESS_TPF_NEB_SAP_vs_MOM_pixel_masks
          gh run download 43319246311 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-five-new-TESS-SPOC-source-FROZEN-before-any-centroids \
            --dir evidence/frozen
          gh run download 43333211789 --repo "DrewThomas09/ASTR_FInal_Project" \
            -n original-ExoFOP-two-NEB-ground-AIJ-T6-T11-plate-solved-WCS-sky-TIC-identity \
            --dir evidence/ground
          test -s evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json
          test -s evidence/ground/two_ground_NEBS_actual_AIJ_aperture_WCS_to_external_TIC_sky_identity.json
      - name: Read original NASA SPOC 2-minute TPF pixel masks at precommitted frozen sectors and exact ground-verified neighboring TIC positions
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          python -u tess_two_ground_neb_original_TPF_aperture_mask_check_nov12.py \
            --original-frozen-five evidence/frozen/FROZEN_FIVE_NEW_NEB_SPOC_PRE_CENTROID_SOURCE_MANIFEST.json \
            --original-ground-sky evidence/ground/two_ground_NEBS_actual_AIJ_aperture_WCS_to_external_TIC_sky_identity.json \
            --out results/original_TESS_TPF_NEB_SAP_vs_MOM_pixel_masks \
            --working data/original_ground_supported_NEB_TPF \
            2>&1 | tee results/original_TESS_TPF_NEB_SAP_vs_MOM_pixel_masks/original_TESS_TPF_mask_science.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/original_TESS_TPF_NEB_SAP_vs_MOM_pixel_masks/original_two_ground_NEBS_SPOC_TPF_SAP_and_moment_centroid_mask_geometry.json').read_text())
          assert d['n_original_ground_supported_source_hosts_attempted']==2
          assert {x['host_TIC_ID'] for x in d['original_source_mask_and_neighbor_position_results']}=={382437043,264303333}
          print('PASS: all exact original source TIC identities, missingness and TPF pixel aperture bitmasks retained; not PRF light fraction')
          PY
      - name: Archive real original TPF mask bitmaps, source original SHA, true TIC projected positions, figures, and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-SPOC-TPF-two-ground-NEB-SAP-vs-MOM-aperture-pixel-source-WCS-geometry-NOT-flux-capture
          path: results/original_TESS_TPF_NEB_SAP_vs_MOM_pixel_masks/
          retention-days: 90
          if-no-files-found: warn
