name: Kepler v8 source-backed model audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'kepler_v8_snr_vetting_audit.py'
      - '.github/workflows/kepler-v8-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical libraries
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scikit-learn>=1.3,<2'
      - name: Recover archived untouched original-data predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/original
          gh run download 42513638366 --repo '${{ github.repository }}' --name dr25-paired-host-statistical-accuracy-inference --dir results/original
      - name: Reproduce historical Kepler labels and star-level confidence intervals
        run: python kepler_v8_snr_vetting_audit.py results/original/primary_heldout_paired_predictions.csv --out results/audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-kepler-v8-snr-label-audit
          retention-days: 90
          path: results/audit/
          if-no-files-found: warn
