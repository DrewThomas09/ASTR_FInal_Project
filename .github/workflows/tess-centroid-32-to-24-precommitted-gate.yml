name: Frozen 32 Development-Calibrated TESS Centroid Gate Tested on 24 Different Stars
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-centroid-32-to-24-precommitted-gate.yml'
      - 'TESS_32_TO_24_CENTROID_POSITIVE_REFERENCE_GATE_FROZEN_2026_11_08.json'
      - 'tess_centroid_32_to_24_frozen_calibration_eval.py'
      - 'tests/test_tess_centroid_32_to_24_frozen_calibration_eval.py'
permissions:
  contents: read
  actions: read
jobs:
  evaluate-32-development-to-24-new-star-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed source-verification and statistical-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scikit-learn>=1.3,<2' 'matplotlib>=3.7,<4' 'pytest>=8,<10' 'scipy>=1.11,<2' 'astropy>=6,<9' 'requests>=2.31,<3'
      - name: Run every scientific test before looking at the 24-star precommitted rule results
        run: python -m pytest -q tests
      - name: Verify original 24-star selection is reproducible from canonical NASA catalogue WITHOUT reading a score
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/verified_nasa_2025
          gh run download 42516458999 --repo "${{ github.repository }}" \
            -n official-exominer-2025-tess-labeled-unlabeled-catalogs-verified \
            --dir data/verified_nasa_2025
          python -m scripts.reproduce_frozen_24star_centroid_holdout \
            --catalog data/verified_nasa_2025/exominerplusplus_catalog_labeled_tces_s1-s67_tess-spoc-2min_complete_1-14-2025_1039.csv \
            --manifest TESS_NEW_24STAR_CENTROID_RULE_HOLDOUT_FROZEN_2026_11_08.json
      - name: Retrieve separately completed, immutable original 32 and source-disjoint 24 real NASA centroid experiments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/development32 data/holdout24
          gh run download 42526063290 --repo "${{ github.repository }}" \
            -n real-original-NASA-TESS-32star-centroid-with-fixed-manual-review-gate-NOT-neural-improvement \
            --dir data/development32
          gh run download 42526495887 --repo "${{ github.repository }}" \
            -n original-NASA-24-new-to-project-TESS-stars-untuned-centroid-rule-test-NOT-independent-NASA-training-holdout \
            --dir data/holdout24
          test -s data/development32/centroid_physics_analysis/all_32_original_TESS_stars_unchanged_NASA_scores_and_centroid_windows.csv
          test -s data/holdout24/24star_original_TESS_centroid_analysis/all_24_UNSEEN_TO_OUR_CENTROID_RULE_source_TICs_with_NASA_original_scores.csv
      - name: Calculate fixed 32-only positive-reference threshold and apply ONCE to all new 24 star source values
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir -p results/centroid_32dev_24holdout
          python -u tess_centroid_32_to_24_frozen_calibration_eval.py \
            --frozen TESS_32_TO_24_CENTROID_POSITIVE_REFERENCE_GATE_FROZEN_2026_11_08.json \
            --development-32 data/development32/centroid_physics_analysis/all_32_original_TESS_stars_unchanged_NASA_scores_and_centroid_windows.csv \
            --holdout-24 data/holdout24/24star_original_TESS_centroid_analysis/all_24_UNSEEN_TO_OUR_CENTROID_RULE_source_TICs_with_NASA_original_scores.csv \
            --holdout-manifest TESS_NEW_24STAR_CENTROID_RULE_HOLDOUT_FROZEN_2026_11_08.json \
            --out results/centroid_32dev_24holdout \
            2>&1 | tee results/centroid_32dev_24holdout/source_precommitted_calibration_evaluation.log
          cp TESS_32_TO_24_CENTROID_POSITIVE_REFERENCE_GATE_FROZEN_2026_11_08.json results/centroid_32dev_24holdout/frozen_before_original_24_results_gate.json
          cp TESS_NEW_24STAR_CENTROID_RULE_HOLDOUT_FROZEN_2026_11_08.json results/centroid_32dev_24holdout/source24_frozen_before_centroid_model_results.json
      - name: Archive all original 24 source outcomes and unchanged 32-dev percentile rule, including any negative outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-TESS-centroid-32-development-to-24-new-star-untuned-holdout-review-flag-no-NASA-CNN-modification
          retention-days: 90
          if-no-files-found: warn
          path: results/centroid_32dev_24holdout/
