name: Fresh Kepler Localized Step Study
on:
  push:
    paths:
      - '.github/workflows/localized-step-study.yml'
      - 'localized_discontinuity.py'
      - 'localized_step_ablation.py'
      - 'tests/test_localized_discontinuity.py'
      - 'tests/test_localized_step_ablation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeclared-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same science and test packages as project
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<4" "matplotlib>=3.7,<4" "astropy>=6,<9" "scipy>=1.11,<2" "requests>=2.31,<3" "scikit-learn>=1.3,<2" "pytest>=8,<10"
      - name: Run all scientific regression tests
        run: python -m pytest -q tests
      - name: Compare original BLS, gap masking and physical step masking on real Kepler stars
        shell: bash
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p results/localized_step_study
          timeout -k 10s 1100s python -u localized_step_ablation.py --manifest LOCALIZED_STEP_STUDY_FROZEN_2026_11_07.json --out results/localized_step_study 2>&1 | tee results/localized_step_study/run.log
      - name: Preserve all planned sources, period and proxy scores and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-kepler-localized-defect-ablation
          retention-days: 90
          if-no-files-found: warn
          path: results/localized_step_study/
