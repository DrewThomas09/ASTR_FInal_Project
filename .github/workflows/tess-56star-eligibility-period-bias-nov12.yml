name: Real 56-star TESS event eligibility and period selection-bias audit (Nov 12)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tess-56star-eligibility-period-bias-nov12.yml'
      - 'tess_source_eligibility_period_bias_nov12.py'
permissions:
  contents: read
  actions: read
jobs:
  verify-previous-original-nasa-data-and-source-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original scientific audit dependencies
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'matplotlib>=3.7,<4' 'pytest>=8,<10' 'scikit-learn>=1.3,<2' 'astropy>=6,<9' 'requests>=2.31,<3'
      - name: Verify project regression suite
        run: python -m pytest -q tests
      - name: Download exactly the two previously completed original NASA ExoMiner TESS source measurement archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/nasa_dev32 data/nasa_fixed24 results/source_eligibility_nov12
          gh run download 42526063290 --repo "${{ github.repository }}" \
            -n real-original-NASA-TESS-32star-centroid-with-fixed-manual-review-gate-NOT-neural-improvement \
            --dir data/nasa_dev32
          gh run download 42526495887 --repo "${{ github.repository }}" \
            -n original-NASA-24-new-to-project-TESS-stars-untuned-centroid-rule-test-NOT-independent-NASA-training-holdout \
            --dir data/nasa_fixed24
          test -s data/nasa_dev32/centroid_physics_analysis/all_32_original_TESS_stars_unchanged_NASA_scores_and_centroid_windows.csv
          test -s data/nasa_fixed24/24star_original_TESS_centroid_analysis/all_24_UNSEEN_TO_OUR_CENTROID_RULE_source_TICs_with_NASA_original_scores.csv
      - name: Compute actual TESS period/event-window missingness, permutation test, bootstrap CI and figure
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -u tess_source_eligibility_period_bias_nov12.py \
            --development32 data/nasa_dev32/centroid_physics_analysis/all_32_original_TESS_stars_unchanged_NASA_scores_and_centroid_windows.csv \
            --additional24 data/nasa_fixed24/24star_original_TESS_centroid_analysis/all_24_UNSEEN_TO_OUR_CENTROID_RULE_source_TICs_with_NASA_original_scores.csv \
            --out results/source_eligibility_nov12 \
            2>&1 | tee results/source_eligibility_nov12/source_period_audit_stdout.log
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('results/source_eligibility_nov12/real_TESS_24star_source_period_eligibility_summary.json').read_text())
          assert m['n_original_sources_with_three_complete_event_windows']==[23,17]
          assert m['n_not_evaluable_total']==16
          assert m['new24_original_model_agreement_with_older_binary_historical_category_at_point5']==24
          assert m['by_historical_class']=={
            'KP':{'total':6,'eligible':5},'CP':{'total':6,'eligible':5},
            'EB':{'total':6,'eligible':6},'NTP':{'total':6,'eligible':1}}
          assert abs(m['new24_spearman_period_vs_qualifying_windows']+0.8953194714356454)<1e-12
          assert abs(m['period_consistent_22_sources_rho']+0.9025360950457582)<1e-12
          assert abs(m['EB_vs_NTP_fisher_exact_2sided_p_exploratory']-.015151515151515154)<1e-10
          assert m['permutation_trials']==100000
          print('Original TESS 56-star selection-bias audit verified: measured event availability unequal, score unchanged, 24/24 older-label ceiling effect.')
          PY
      - name: Preserve negative findings, complete original source row registry, plot, tests and SHA256s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NASA-v240-56TESSstar-real-period-eligibility-bias-exploratory-secondary-audit
          retention-days: 90
          if-no-files-found: warn
          path: results/source_eligibility_nov12/
