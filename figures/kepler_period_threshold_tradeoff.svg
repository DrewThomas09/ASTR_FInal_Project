<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332"><rect width="900" height="332" fill="white"/><text x="32" y="36" font-family="Georgia,serif" font-size="24" fill="#203648">Testing the period-specific cutoff</text><text x="32" y="64" font-size="14" font-family="Arial" fill="#555">145 historical Kepler DR25 long-period labels, first separately grouped test split</text><text x="32" y="105" font-size="15" fill="#30393d" font-family="Arial">Candidate recall</text><rect x="340" y="84" width="289.64" height="17" rx="2" fill="#2f667f"/><rect x="340" y="107" width="393.12" height="17" rx="2" fill="#ae7248"/><text x="636.64" y="97" font-size="14" font-family="Arial" fill="#2f667f">72.4%</text><text x="740.12" y="121" font-size="14" font-family="Arial" fill="#ae7248">98.3%</text><text x="32" y="177" font-size="15" fill="#30393d" font-family="Arial">Historical FP acceptance</text><rect x="340" y="156" width="128.72" height="17" rx="2" fill="#2f667f"/><rect x="340" y="179" width="294.24" height="17" rx="2" fill="#ae7248"/><text x="475.72" y="169" font-size="14" font-family="Arial" fill="#2f667f">32.2%</text><text x="641.24" y="193" font-size="14" font-family="Arial" fill="#ae7248">73.6%</text><text x="32" y="249" font-size="15" fill="#30393d" font-family="Arial">Balanced accuracy</text><rect x="340" y="228" width="280.44" height="17" rx="2" fill="#2f667f"/><rect x="340" y="251" width="249.44" height="17" rx="2" fill="#ae7248"/><text x="627.44" y="241" font-size="14" font-family="Arial" fill="#2f667f">70.1%</text><text x="596.44" y="265" font-size="14" font-family="Arial" fill="#ae7248">62.4%</text><text x="32" y="318" font-size="13" font-family="Arial" fill="#555">Blue: global cutoff. Orange: period-specific cutoff. FPR lower is better. No rank scores changed.</text></svg>