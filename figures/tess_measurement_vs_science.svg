<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-label="TESS pointing adjustment results and limitations"><rect width="980" height="320" fill="#fff"/><text x="35" y="42" font-family="Georgia,serif" font-size="25" fill="#1f1f1f">One small TESS follow-up: cleaner numbers versus correct sources</text><rect x="30" y="90" width="207" height="116" rx="7" fill="#f2f5f7" stroke="#888"/><text x="43" y="117" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#1b3650">TESS data</text><text x="43" y="153" font-family="Arial,sans-serif" font-size="15" fill="#333">Measured star-light</text><text x="43" y="179" font-family="Arial,sans-serif" font-size="15" fill="#333">centroids + pointing</text><text x="245" y="157" font-family="Arial,sans-serif" font-size="24" fill="#555">→</text><rect x="270" y="90" width="207" height="116" rx="7" fill="#f2f5f7" stroke="#888"/><text x="283" y="117" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#1b3650">Small correction</text><text x="283" y="153" font-family="Arial,sans-serif" font-size="15" fill="#333">Subtract recorded</text><text x="283" y="179" font-family="Arial,sans-serif" font-size="15" fill="#333">pointing movement</text><text x="485" y="157" font-family="Arial,sans-serif" font-size="24" fill="#555">→</text><rect x="510" y="90" width="207" height="116" rx="7" fill="#f2f5f7" stroke="#888"/><text x="523" y="117" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#1b3650">Steadier?</text><text x="523" y="153" font-family="Arial,sans-serif" font-size="15" fill="#333">44 of 56 stars</text><text x="523" y="179" font-family="Arial,sans-serif" font-size="15" fill="#333">lower local drift proxy</text><text x="725" y="157" font-family="Arial,sans-serif" font-size="24" fill="#555">→</text><rect x="750" y="90" width="207" height="116" rx="7" fill="#fafafa" stroke="#888"/><text x="763" y="117" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#1b3650">More accurate?</text><text x="763" y="153" font-family="Arial,sans-serif" font-size="15" fill="#333">2 of 4 source directions</text><text x="763" y="179" font-family="Arial,sans-serif" font-size="15" fill="#333">improved; 2 worsened</text><text x="35" y="252" font-family="Arial,sans-serif" font-size="16" fill="#333">Different comparison groups and different outcomes: these fractions must not be combined.</text><text x="35" y="280" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">Conclusion: no reliable improvement in physical source identification was demonstrated.</text></svg>