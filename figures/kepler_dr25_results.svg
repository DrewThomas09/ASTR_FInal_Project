<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-label="Historical Kepler DR25 three method performance bar chart"><rect width="1100" height="710" fill="#ffffff"/><text x="55" y="52" font-family="Georgia,serif" font-size="29" fill="#202020">What the three Kepler screening methods got right (and wrong)</text><text x="55" y="83" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">1,619 held-out signals from 1,385 stars | compared with historical NASA DR25 labels, not confirmed planets</text><text x="55" y="125" font-family="Georgia,serif" font-size="20" fill="#252525">Accuracy (% labeled correctly)</text><text x="55" y="160" font-family="Arial,sans-serif" font-size="15" fill="#222">SNR-only</text><rect x="250" y="143" width="350.54" height="24" rx="3" fill="#808080"/><text x="610.5440000000001" y="161" font-family="Arial,sans-serif" font-size="15" fill="#222">52.32%</text><text x="55" y="198" font-family="Arial,sans-serif" font-size="15" fill="#222">4-feature logistic</text><rect x="250" y="181" width="517.71" height="24" rx="3" fill="#416783"/><text x="777.709" y="199" font-family="Arial,sans-serif" font-size="15" fill="#222">77.27%</text><text x="55" y="236" font-family="Arial,sans-serif" font-size="15" fill="#222">4-feature random forest</text><rect x="250" y="219" width="546.65" height="24" rx="3" fill="#1c3d63"/><text x="806.653" y="237" font-family="Arial,sans-serif" font-size="15" fill="#222">81.59%</text><text x="55" y="313" font-family="Georgia,serif" font-size="20" fill="#252525">Candidate-label recall (% retained)</text><text x="55" y="348" font-family="Arial,sans-serif" font-size="15" fill="#222">SNR-only</text><rect x="250" y="331" width="609.37" height="24" rx="3" fill="#808080"/><text x="869.365" y="349" font-family="Arial,sans-serif" font-size="15" fill="#222">90.95%</text><text x="55" y="386" font-family="Arial,sans-serif" font-size="15" fill="#222">4-feature logistic</text><rect x="250" y="369" width="599.11" height="24" rx="3" fill="#416783"/><text x="859.114" y="387" font-family="Arial,sans-serif" font-size="15" fill="#222">89.42%</text><text x="55" y="424" font-family="Arial,sans-serif" font-size="15" fill="#222">4-feature random forest</text><rect x="250" y="407" width="584.17" height="24" rx="3" fill="#1c3d63"/><text x="844.173" y="425" font-family="Arial,sans-serif" font-size="15" fill="#222">87.19%</text><text x="55" y="500" font-family="Georgia,serif" font-size="20" fill="#252525">Historical FP rate (% wrongly accepted)</text><text x="55" y="535" font-family="Arial,sans-serif" font-size="15" fill="#222">SNR-only</text><rect x="250" y="518" width="606.28" height="24" rx="3" fill="#808080"/><text x="866.283" y="536" font-family="Arial,sans-serif" font-size="15" fill="#222">90.49%</text><text x="55" y="573" font-family="Arial,sans-serif" font-size="15" fill="#222">4-feature logistic</text><rect x="250" y="556" width="242.54" height="24" rx="3" fill="#416783"/><text x="502.54" y="574" font-family="Arial,sans-serif" font-size="15" fill="#222">36.20%</text><text x="55" y="611" font-family="Arial,sans-serif" font-size="15" fill="#222">4-feature random forest</text><rect x="250" y="594" width="164.89" height="24" rx="3" fill="#1c3d63"/><text x="424.887" y="612" font-family="Arial,sans-serif" font-size="15" fill="#222">24.61%</text><text x="55" y="679" font-family="Arial,sans-serif" font-size="14" fill="#555">Lower is better only in the last panel. Reported candidate labels are not ground truth; models have different held-out recall.</text></svg>